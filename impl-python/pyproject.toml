[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "weft-format"
version = "1.0.2"
description = "Weft — AI-first textual data format (Python reference implementation). Parse, format (byte-identical strict-canonical output), lossless JSON bridge, schema validation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "mossbenchlab"}]
keywords = ["weft", "serialization", "data-format", "canonical", "json", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: File Formats",
]

[project.urls]
Homepage = "https://github.com/mossbenchlab/weft"
Specification = "https://github.com/mossbenchlab/weft/blob/main/spec/SPEC.md"
Changelog = "https://github.com/mossbenchlab/weft/blob/main/CHANGELOG.md"
Security = "https://github.com/mossbenchlab/weft/blob/main/SECURITY.md"

[project.scripts]
weft = "weft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
