[project]
name = "weft"
version = "1.0.1"
description = "Weft 1.0 — AI-first structured data format (Python reference implementation)"
license = { text = "MIT" }
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
